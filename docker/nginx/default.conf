server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/public;

    # Look up "app" through Docker's DNS on each request (cached 10 s) instead of once at
    # startup. Otherwise rebuilding the app container gives it a new IP and nginx keeps
    # sending to the old one: 502 Bad Gateway, "connect() failed (111: Connection refused)".
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.ht {
        deny all;
    }

    client_max_body_size 20M;
}
