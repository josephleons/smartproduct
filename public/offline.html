<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174551">
  <title>SmartLabel · Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #F7FAFB; color: #1F2D33; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { margin: 4px 0; color: #5c6b70; }
    button { margin-top: 20px; padding: 12px 24px; border: 0; border-radius: 10px; background: #0F6680; color: #fff; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/pwa/icon-192.png" alt="">
    <h1>Hakuna mtandao · You are offline</h1>
    <p>Unganisha intaneti kisha jaribu tena.</p>
    <p>Connect to the internet and try again.</p>
    <button onclick="location.reload()">Jaribu tena · Retry</button>
  </main>
</body>
</html>
