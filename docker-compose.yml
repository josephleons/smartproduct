# SmartLabel local development stack.
# Host ports are chosen to avoid clashing with other local projects
# (8080/8082/8083/8084/3303/3307/3308 are already in use on this machine).
# Override any of them in .env: APP_PORT, FORWARD_DB_PORT, FORWARD_REDIS_PORT, FORWARD_PMA_PORT.

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      WWWUSER: ${WWWUSER:-1000}
      WWWGROUP: ${WWWGROUP:-1000}
  image: smartlabel-app
  restart: unless-stopped
  working_dir: /var/www
  volumes:
    - ./:/var/www
  networks:
    - smartlabel
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *app
    container_name: smartlabel_app

  queue:
    <<: *app
    container_name: smartlabel_queue
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=60"]

  # Runs routes/console.php schedules, e.g. the hourly billing sweep (CheckSubscriptions).
  scheduler:
    <<: *app
    container_name: smartlabel_scheduler
    command: ["php", "artisan", "schedule:work"]

  nginx:
    image: nginx:alpine
    container_name: smartlabel_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8095}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - smartlabel
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: smartlabel_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-smartlabel}
      MYSQL_USER: ${DB_USERNAME:-smartlabel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3315}:3306"
    volumes:
      - smartlabel_mysql_data:/var/lib/mysql
      - ./docker/mysql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql
    networks:
      - smartlabel
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: smartlabel_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6385}:6379"
    volumes:
      - smartlabel_redis_data:/data
    networks:
      - smartlabel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: smartlabel_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "${FORWARD_PMA_PORT:-8096}:80"
    networks:
      - smartlabel
    depends_on:
      - mysql

networks:
  smartlabel:
    driver: bridge

volumes:
  smartlabel_mysql_data:
  smartlabel_redis_data:
